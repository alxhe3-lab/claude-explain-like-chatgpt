<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Resting membrane potential as a tug of war</title>
  <desc>Potassium pulls hard toward minus 95 millivolts, sodium pulls weakly toward plus 67; the resting value of a neuron stops at minus 70 millivolts.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" rx="16" fill="#FFFFFF"/>
  <rect x="40" y="30" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="160" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Potassium K⁺</text>
  <text x="160" y="72" text-anchor="middle" font-size="12.5" fill="#0F6E56">Many open channels</text>
  <rect x="400" y="30" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="520" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">Sodium Na⁺</text>
  <text x="520" y="72" text-anchor="middle" font-size="12.5" fill="#993C1D">Very few open channels</text>
  <text x="130" y="119" font-size="15" font-weight="600" fill="#2C2C2A">The marker stops at −70 mV</text>
  <line x1="136" y1="145" x2="74" y2="145" stroke="#1D9E75" stroke-width="7"/>
  <polygon points="56,145 76,134 76,156" fill="#1D9E75"/>
  <line x1="156" y1="145" x2="612" y2="145" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="146" cy="145" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <line x1="146" y1="155" x2="146" y2="189" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="60" y1="195" x2="620" y2="195" stroke="#888780" stroke-width="0.8"/>
  <g stroke="#888780" stroke-width="0.8"><line x1="60" y1="189" x2="60" y2="201"/><line x1="146" y1="189" x2="146" y2="201"/><line x1="388" y1="189" x2="388" y2="201"/><line x1="620" y1="189" x2="620" y2="201"/></g>
  <g font-size="12.5" fill="#5F5E5A">
    <text x="40" y="222">−95 mV</text>
    <text x="40" y="240">K⁺ equilibrium</text>
    <text x="146" y="222" text-anchor="middle">−70 mV</text>
    <text x="388" y="222" text-anchor="middle">0</text>
    <text x="640" y="222" text-anchor="end">+67 mV</text>
    <text x="640" y="240" text-anchor="end">Na⁺ equilibrium</text>
    <text x="340" y="276" text-anchor="middle">Thick rope = the ion that crosses best pulls hardest</text>
  </g>
</svg>
